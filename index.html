<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For My Love Batot❤️</title>

  <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

/* ❗ هنا التعديل المهم */
body{
    min-height:100vh;
    overflow-y:auto;   /* بدل hidden */
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
}

/* شكل شريط السكرول */
body::-webkit-scrollbar{
    width:10px;
}

body::-webkit-scrollbar-track{
    background:#111;
}

body::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:10px;
}

body::-webkit-scrollbar-thumb:hover{
    background:#777;
}

.overlay{
    position:absolute;
    width:100%;
    height:100%;
    background:
    linear-gradient(
        rgba(0,0,0,0.7),
        rgba(0,0,0,0.9)
    ),
    url("https://images.unsplash.com/photo-1519608487953-e999c86e7455");

    background-size:cover;
    background-position:center;
    z-index:-1;

    animation:zoom 20s infinite alternate;
}

@keyframes zoom{
    from{ transform:scale(1); }
    to{ transform:scale(1.1); }
}

.container{
    width:90%;
    max-width:700px;
    animation:fadeIn 2s ease;
    padding:80px 0; /* عشان يبقى فيه مساحة للسكروول */
}

.title{
    font-size:55px;
    margin-bottom:20px;
    text-shadow:0 0 20px rgba(255,255,255,0.5);
}

.subtitle{
    font-size:20px;
    color:#ddd;
    margin-bottom:40px;
}

button{
    padding:15px 40px;
    border:none;
    border-radius:50px;
    background:white;
    color:black;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

.hidden-content{
    margin-top:40px;
    opacity:0;
    transform:translateY(30px);
    transition:1.5s;
}

.show{
    opacity:1;
    transform:translateY(0);
}

.main-photo{
    width:280px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 0 30px rgba(255,255,255,0.3);
}

.love-text{
    font-size:32px;
    margin-bottom:20px;
}

.message{
    font-size:18px;
    line-height:1.8;
    color:#ccc;
}

@keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
}

.heart{
    position:fixed;
    color:red;
    font-size:20px;
    animation:float 6s linear infinite;
    opacity:0.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(1);
        opacity:0;
    }
    50%{ opacity:1; }
    100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

  </style>
</head>

<body>

<div class="overlay"></div>

<div class="container">

  <h1 class="title">To The Most Beautiful Girl ❤️</h1>

  <p class="subtitle">
    I made this little world just for you... 
    my babe kholod
  </p>

  <button id="startBtn">
    Start The Surprise ✨
  </button>

  <div class="hidden-content" id="content">

    <img src="us.jpg.jpeg" class="main-photo">

    <h2 class="love-text">
      Every moment with you feels like a movie scene 🎬
    </h2>

    <p class="message">
      No matter what happens...
      you will always be my favorite person ❤️
    </p>

  </div>

</div>

<script>

window.onload = function(){

const btn = document.getElementById("startBtn");
const content = document.getElementById("content");

btn.addEventListener("click", () => {
    content.classList.add("show");
    btn.style.display = "none";
});

/* قلوب متحركة */
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = Math.random() * 3 + 3 + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);

}

</script>

</body>
</html>
